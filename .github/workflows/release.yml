name: Build and Release

on:
  push:
    tags:
      - "v*.*.*" # Trigger on semantic version tags
      - "v*"     # Trigger on major version tags like v1

permissions:
  contents: write # Needed for uploading release assets and creating releases
  packages: write # Needed for uploading artifacts
  actions: read # Needed to read actions/checkout@v3 and other actions

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
        goos: [linux, darwin]
        goarch: [amd64, arm64, 386]
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04
            goos: linux
            goarch: arm64
          - os: ubuntu-24.04
            goos: linux
            goarch: 386
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
        exclude:
          - os: ubuntu-24.04
            goos: darwin
          - os: macos-latest
            goos: linux
          - os: macos-latest
            goarch: 386

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21" # Or your target Go version

      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o senk-${{ matrix.goos }}-${{ matrix.goarch }} main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: senk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: senk-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Set up GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Authenticate GitHub CLI
        run: |
          gh auth login --with-token <<< ${{ secrets.GITHUB_TOKEN }}

      - name: Get Commit Messages
        id: get_commit_messages
        run: |
          # Fetch the previous tag
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ || echo "")
          if [ -z "$previous_tag" ]; then
            # No previous tag found, use initial commit
            commits=$(git log --pretty=format:"%h %s")
          else
            # Get the list of commits between the previous tag and the current tag
            commits=$(git log --pretty=format:"%h %s" $previous_tag..HEAD)
          fi
          echo "commits<<EOF" >> $GITHUB_ENV
          echo "$commits" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        run: |
          gh release create ${{ github.ref }} \
            ./senk-linux-amd64/senk-linux-amd64 \
            ./senk-linux-arm64/senk-linux-arm64 \
            ./senk-linux-386/senk-linux-386 \
            ./senk-darwin-amd64/senk-darwin-amd64 \
            ./senk-darwin-arm64/senk-darwin-arm64 \
            --title "Release ${{ github.ref }}" --notes "$commits"
